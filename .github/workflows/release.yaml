name: Release

# Push a tag like v0.5 to build the watch app and Billy Companion and publish
# them as a GitHub release, with notes from release-notes/<tag>.md.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check versions match the tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PBW_VERSION=$(node -e "console.log(require('./app/package.json').version)")
          APK_VERSION=$(grep -oP 'versionName = "\K[^"]+' companion-android/app/build.gradle.kts)
          echo "tag=$TAG pbw=$PBW_VERSION apk=$APK_VERSION"
          test "$TAG" = "$PBW_VERSION" && test "$TAG" = "$APK_VERSION"
          test -f "release-notes/${GITHUB_REF_NAME}.md"
      - name: Install Pebble tool and SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl1.2debian libfdt1 libpixman-1-0 libfreetype6 > /dev/null || true
          pip install --quiet pebble-tool
          mkdir -p ~/.pebble-sdk && touch ~/.pebble-sdk/NO_TRACKING
          yes | pebble sdk install latest
      - name: Test
        run: |
          node tools/pkjs-tests/agent.test.js
          node tools/pkjs-tests/delivery.test.js
      - name: Build watch app
        run: cd app && yes | pebble build
      - name: Build Billy Companion
        run: |
          test -f companion-android/debug.keystore || { echo "debug.keystore missing"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > companion-android/local.properties
          cd companion-android && chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Name files
        run: |
          V=${GITHUB_REF_NAME#v}
          mkdir out
          cp app/build/app.pbw "out/Billy-$V.pbw"
          cp companion-android/app/build/outputs/apk/debug/*.apk "out/BillyCompanion-$V.apk"
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Billy ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          make_latest: true
          files: out/*
