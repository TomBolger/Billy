name: Build Billy

on:
  push:
    paths:
      - 'app/**'
      - 'companion-android/**'
      - '.github/workflows/build-pbw.yaml'
  workflow_dispatch:

jobs:
  pbw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Pebble tool and SDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl1.2debian libfdt1 libpixman-1-0 libfreetype6 > /dev/null || true
          pip install --quiet pebble-tool
          mkdir -p ~/.pebble-sdk && touch ~/.pebble-sdk/NO_TRACKING
          yes | pebble sdk install latest
      - name: Offline agent tests
        run: node tools/pkjs-tests/agent.test.js
      - name: Build PBW
        run: cd app && yes | pebble build
      - name: Upload PBW
        uses: actions/upload-artifact@v4
        with:
          name: Billy-PBW
          path: app/build/app.pbw
          if-no-files-found: error

  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build companion (compile check)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > companion-android/local.properties
          cd companion-android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BillyCompanion-debug-APK-CI-signed
          path: companion-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
